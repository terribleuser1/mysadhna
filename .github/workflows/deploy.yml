name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Production
        run: flutter build web --release

      - name: Deploy to Vercel
        run: |
          # Clean secrets to strip any accidental quotes or spaces
          CLEAN_TOKEN=$(echo "${{ secrets.VERCEL_TOKEN }}" | tr -d ' "\r\n')
          CLEAN_ORG=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d ' "\r\n')
          CLEAN_PRJ=$(echo "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d ' "\r\n')

          # Link project configuration directly inside the build directory
          mkdir -p build/web/.vercel
          echo "{\"orgId\":\"$CLEAN_ORG\",\"projectId\":\"$CLEAN_PRJ\"}" > build/web/.vercel/project.json

          # Deploy using latest official Vercel CLI
          cd build/web
          npx --yes vercel@latest deploy --prod --token="$CLEAN_TOKEN" --yes