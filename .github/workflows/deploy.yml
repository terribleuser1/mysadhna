name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Production
        # --pwa-strategy none prevents aggressive background caching of large assets
        run: flutter build web --release --pwa-strategy=none

      - name: Copy APK to Build Directory
        # Copy the APK into build/web AFTER the web build so the service worker ignores it
        run: |
          if [ -f web/MySadhna.apk ]; then
            cp web/MySadhna.apk build/web/MySadhna.apk
          fi

      - name: Deploy to Vercel
        run: |
          CLEAN_TOKEN=$(echo "${{ secrets.VERCEL_TOKEN }}" | tr -d ' "\r\n')
          CLEAN_ORG=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d ' "\r\n')
          CLEAN_PRJ=$(echo "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d ' "\r\n')

          mkdir -p build/web/.vercel
          echo "{\"orgId\":\"$CLEAN_ORG\",\"projectId\":\"$CLEAN_PRJ\"}" > build/web/.vercel/project.json

          cd build/web
          npx --yes vercel@latest deploy --prod --token="$CLEAN_TOKEN" --yes