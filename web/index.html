<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Primary Meta Tags -->
  <title>My Sadhna - Daily Vaishnava Sadhana & Sukriti Tracker</title>
  <meta name="title" content="My Sadhna - Daily Vaishnava Sadhana & Sukriti Tracker">
  <meta name="description" content="Daily Vaishnava Sadhana and Sukriti Points tracking app for devotees and counselor circles.">
  <meta name="theme-color" content="#FAF9F6">

  <!-- Open Graph / WhatsApp / Facebook Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://my-sadhna.vercel.app/">
  <meta property="og:title" content="My Sadhna - Daily Vaishnava Sadhana & Sukriti Tracker">
  <meta property="og:description" content="Offer your daily sadhana, track japa rounds, reading, hearing, and view counselor circle standings.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Sadhna - Daily Vaishnava Sadhana & Sukriti Tracker">
  <meta name="twitter:description" content="Daily Vaishnava Sadhana and Sukriti Points tracking app for devotees and counselor circles.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS Meta Tags & Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Sadhna">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; padding: 0; background-color: #FAF9F6;">
  <!-- Instant Devotional Loading Screen -->
  <div id="loading-screen" style="
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background-color: #FAF9F6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    z-index: 9999;
  ">
    <div style="
      width: 52px; height: 52px;
      border: 4px solid #FDE68A;
      border-top: 4px solid #C04B00;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    "></div>
    <p style="margin-top: 20px; color: #1F1A17; font-size: 17px; font-weight: 700; letter-spacing: 0.3px;">
      My Sadhna
    </p>
    <p style="margin-top: -10px; color: #6B5E55; font-size: 13px; font-weight: 500;">
      हरे कृष्ण हरे राम 🙏
    </p>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.35s ease';
        setTimeout(function () { loader.remove(); }, 350);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
